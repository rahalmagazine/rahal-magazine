<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة رحال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4ebdd;color:#252827;font-family:'Cairo',Arial,sans-serif;line-height:1.8}
header{background:#142c2a;color:#d8b879;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:20px;margin:0}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h2{color:#142c2a;font-size:22px;margin:26px 0 12px}
label{display:block;font-size:14px;color:#142c2a;font-weight:600;margin-top:10px}
input,select,textarea{width:100%;padding:10px;margin:6px 0 4px;border:1px solid #c9bdab;border-radius:6px;font-family:inherit;font-size:15px;background:#fff;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:auto;margin-left:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.btn{padding:10px 16px;background:#142c2a;color:#d8b879;border:1px solid #142c2a;border-radius:6px;cursor:pointer;font-family:inherit;font-size:15px}
.btn.light{background:#fff;color:#142c2a}
.btn.danger{background:#fff;color:#a33;border-color:#a33}
.btn.small{padding:6px 10px;font-size:13px}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin:0 0 4px;font-size:17px;color:#142c2a}
.meta{font-size:13px;color:#92713b;margin-bottom:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.langs{display:flex;gap:8px;margin:10px 0 14px}
.langs button{flex:1;padding:10px;border:1px solid #142c2a;background:#fff;color:#142c2a;border-radius:6px;cursor:pointer;font-family:inherit}
.langs button.on{background:#142c2a;color:#d8b879}
.msg{padding:10px;border-radius:6px;margin:10px 0;display:none;font-size:15px}
.msg.show{display:block}
.msg.ok{background:#e4f1e4;color:#1d5a1d}
.msg.err{background:#f6e0e0;color:#7a1f1f}
.hidden{display:none}
#login{max-width:360px;margin:50px auto;background:#fff;padding:24px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>لوحة رحال</h1>
<button id="logout" class="btn light small hidden">خروج</button>
</header>
<main>

<section id="login" class="hidden">
<h2 style="margin-top:0">تسجيل الدخول</h2>
<label>الإيميل</label><input id="email" type="email" autocomplete="username">
<label>كلمة السر</label><input id="pass" type="password" autocomplete="current-password">
<div style="margin-top:14px"><button id="loginBtn" class="btn">دخول</button></div>
<div id="lmsg" style="color:#7a1f1f;font-size:14px;margin-top:10px"></div>
</section>

<section id="app" class="hidden">
<div id="msg" class="msg"></div>

<div id="listView">
<div style="margin-bottom:10px"><button id="newBtn" class="btn">+ مقال جديد</button></div>
<h2>المقالات</h2>
<div id="list"></div>
</div>

<div id="editor" class="hidden">
<h2 id="edTitle">مقال جديد</h2>
<div class="langs">
<button type="button" data-l="ar" class="on">العربية</button>
<button type="button" data-l="fr">Français</button>
<button type="button" data-l="en">English</button>
</div>
<label>العنوان</label><input id="f_title">
<label>الملخص القصير</label><textarea id="f_excerpt" style="min-height:60px"></textarea>
<label>نص المقال</label><textarea id="f_body" style="min-height:260px"></textarea>
<label>عنوان SEO (اختياري)</label><input id="f_seo_title">
<label>وصف SEO (اختياري)</label><input id="f_seo_desc">

<h2 style="font-size:18px">خانات مشتركة بين اللغات</h2>
<div class="row">
<div><label>التصنيف</label><select id="f_category"></select></div>
<div><label>الرابط المختصر (slug)</label><input id="f_slug"></div>
<div><label>المدينة (للخريطة)</label><select id="f_city"></select></div>
</div>
<label>رابط الصورة</label><input id="f_image" placeholder="https://...">
<label>المصادر (كل مصدر فسطر، والرابط https:// فآخر السطر)</label><textarea id="f_sources" style="min-height:80px"></textarea>
<label><input id="f_pub" type="checkbox"> منشور (يبان للزوار)</label>
<label><input id="f_feat" type="checkbox"> مقال مميز (يظهر فأعلى الصفحة الرئيسية)</label>
<div class="row" style="margin-top:16px">
<button id="saveBtn" class="btn">حفظ</button>
<button id="cancelBtn" class="btn light">رجوع</button>
</div>
</div>
</section>

</main>

<script>
(function(){
var SB="https://fiqwenrnvwiiondcztpm.supabase.co";
var KEY="sb_publishable_cxciqxe-xfZhDAb8FcGAZA_DzqqCpcx";
var STORE="sb-fiqwenrnvwiiondcztpm-auth-token";
var LANGS=["ar","fr","en"];
var CITIES_LIST=["فاس","الرباط","الدار البيضاء","مراكش","طنجة","مكناس","أكادير","وجدة","تطوان","الصويرة","شفشاون","ورزازات","الداخلة","العيون"];
var CATS=[["culture","الثقافة"],["society","المجتمع"],["science","العلوم"],["history","التاريخ"],["explore","الاستكشاف"]];

function $(id){return document.getElementById(id)}
function session(){try{return JSON.parse(localStorage.getItem(STORE))}catch(e){return null}}
function msg(t,ok){var m=$("msg");m.textContent=t;m.className="msg show "+(ok?"ok":"err")}
function clearMsg(){var m=$("msg");m.textContent="";m.className="msg"}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden")}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden")}
function emptyDraft(){return{title:"",excerpt:"",body:"",seo_title:"",seo_description:""}}

var state={slug:null,lang:"ar",drafts:{},ids:{},shared:{},isExisting:false};

function authJson(path,body){
return fetch(SB+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)})
.then(function(r){return r.text().then(function(t){
var j=t?JSON.parse(t):{};
if(!r.ok)throw new Error(j.error_description||j.msg||"فشل الطلب");
return j;
})})
.then(function(j){localStorage.setItem(STORE,JSON.stringify(j));return j});
}

function refresh(){
var s=session();
if(!s||!s.refresh_token)return Promise.reject(new Error("expired"));
return authJson("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token});
}

function api(path,opts,retry){
opts=opts||{};
var s=session();
var h={apikey:KEY,"Content-Type":"application/json"};
if(s&&s.access_token)h.Authorization="Bearer "+s.access_token;
if(opts.prefer)h.Prefer=opts.prefer;
return fetch(SB+"/rest/v1/"+path,{
method:opts.method||"GET",
headers:h,
body:opts.body?JSON.stringify(opts.body):undefined
}).then(function(r){
if(r.status===401&&!retry){
return refresh().then(function(){return api(path,opts,true)},function(){
localStorage.removeItem(STORE);
showLogin();
throw new Error("انتهت الجلسة، سجل الدخول من جديد");
});
}
return r.text().then(function(t){
if(!r.ok){
var e={};try{e=JSON.parse(t)}catch(x){}
throw new Error(e.message||e.msg||("خطأ "+r.status));
}
return t?JSON.parse(t):null;
});
});
}

function doLogin(){
$("lmsg").textContent="";
authJson("/auth/v1/token?grant_type=password",{email:$("email").value.trim(),password:$("pass").value})
.then(function(){showApp();return loadList()})
.catch(function(e){$("lmsg").textContent=e.message});
}

function logout(){localStorage.removeItem(STORE);showLogin()}

function btn(t,fn,cls){
var x=document.createElement("button");
x.textContent=t;
x.className="btn small "+(cls||"light");
x.onclick=fn;
return x;
}

function loadList(){
clearMsg();
$("editor").classList.add("hidden");
$("listView").classList.remove("hidden");
return api("articles?select=id,slug,lang,title,published,category,created_at&order=created_at.desc")
.then(function(rows){
var groups={},order=[];
rows.forEach(function(r){
if(!groups[r.slug]){groups[r.slug]=[];order.push(r.slug)}
groups[r.slug].push(r);
});
var box=$("list");
box.textContent="";
if(!order.length){box.textContent="ماكاينش مقالات بعد.";return}
order.forEach(function(slug){
var g=groups[slug],first=g[0];
var pub=g.some(function(r){return r.published});
var card=document.createElement("div");card.className="card";
var h=document.createElement("h3");h.textContent=first.title||slug;
var m=document.createElement("div");m.className="meta";
m.textContent=(pub?"منشور":"مسودة")+" • اللغات: "+g.map(function(r){return r.lang}).join(" / ");
var b=document.createElement("div");b.className="btns";
b.appendChild(btn("تعديل",function(){openEditor(slug)}));
b.appendChild(btn("معاينة",function(){
window.open("article.html?s="+encodeURIComponent(slug)+"&lang="+(first.lang||"ar")+(pub?"":"&preview=1"),"_blank");
}));
b.appendChild(btn(pub?"إخفاء":"نشر",function(){togglePub(slug,!pub)}));
b.appendChild(btn("حذف",function(){delArticle(slug)},"danger"));
card.appendChild(h);card.appendChild(m);card.appendChild(b);
box.appendChild(card);
});
})
.catch(function(e){msg(e.message,false)});
}

function togglePub(slug,val){
return api("articles?slug=eq."+encodeURIComponent(slug),{method:"PATCH",body:{published:val},prefer:"return=minimal"})
.then(function(){msg(val?"تم النشر":"تم الإخفاء",true);return loadList()})
.catch(function(e){msg(e.message,false)});
}

function delArticle(slug){
if(!confirm("واش متأكد بغيتي تحذف هاد المقال بكل اللغات؟"))return;
return api("articles?slug=eq."+encodeURIComponent(slug),{method:"DELETE",prefer:"return=minimal"})
.then(function(){msg("تم الحذف",true);return loadList()})
.catch(function(e){msg(e.message,false)});
}

function fillFields(){
var d=state.drafts[state.lang];
$("f_title").value=d.title;
$("f_excerpt").value=d.excerpt;
$("f_body").value=d.body;
$("f_seo_title").value=d.seo_title;
$("f_seo_desc").value=d.seo_description;
markTabs();
}

function saveFieldsToDraft(){
var d=state.drafts[state.lang];
d.title=$("f_title").value;
d.excerpt=$("f_excerpt").value;
d.body=$("f_body").value;
d.seo_title=$("f_seo_title").value;
d.seo_description=$("f_seo_desc").value;
}

function markTabs(){
document.querySelectorAll(".langs button").forEach(function(b){
b.classList.toggle("on",b.getAttribute("data-l")===state.lang);
});
}

function setLang(L){
saveFieldsToDraft();
state.lang=L;
fillFields();
}

function fillShared(){
$("f_category").value=state.shared.category;
$("f_city").value=state.shared.city||"";
$("f_slug").value=state.shared.slug;
$("f_image").value=state.shared.image_url;
$("f_sources").value=state.shared.sources;
$("f_pub").checked=!!state.shared.published;
$("f_feat").checked=!!state.shared.featured;
$("f_slug").readOnly=!!state.isExisting;
}

function readShared(){
state.shared.category=$("f_category").value;
state.shared.city=$("f_city").value;
state.shared.slug=$("f_slug").value.trim();
state.shared.image_url=$("f_image").value.trim();
state.shared.sources=$("f_sources").value;
state.shared.published=$("f_pub").checked;
state.shared.featured=$("f_feat").checked;
}

function showEditor(){
$("listView").classList.add("hidden");
$("editor").classList.remove("hidden");
clearMsg();
window.scrollTo(0,0);
}

function newArticle(){
state.isExisting=false;
state.slug=null;
state.lang="ar";
state.drafts={ar:emptyDraft(),fr:emptyDraft(),en:emptyDraft()};
state.ids={ar:null,fr:null,en:null};
state.shared={category:"culture",city:"",featured:false,slug:"a"+Date.now().toString(36),image_url:"",sources:"",published:false};
$("edTitle").textContent="مقال جديد";
fillShared();
fillFields();
showEditor();
}

function openEditor(slug){
clearMsg();
return api("articles?select=*&slug=eq."+encodeURIComponent(slug))
.then(function(rows){
if(!rows.length){msg("المقال ما لقيناهش",false);return}
state.isExisting=true;
state.slug=slug;
state.lang="ar";
state.drafts={ar:emptyDraft(),fr:emptyDraft(),en:emptyDraft()};
state.ids={ar:null,fr:null,en:null};
rows.forEach(function(r){
var L=LANGS.indexOf(r.lang)>=0?r.lang:"ar";
state.ids[L]=r.id;
state.drafts[L]={
title:r.title||"",
excerpt:r.excerpt||"",
body:r.body||"",
seo_title:r.seo_title||"",
seo_description:r.seo_description||""
};
});
var first=rows[0];
state.shared={
category:first.category||"culture",
city:first.city||"",
featured:rows.some(function(r){return r.featured;}),
slug:slug,
image_url:first.image_url||"",
sources:first.sources||"",
published:rows.some(function(r){return r.published})
};
$("edTitle").textContent="تعديل: "+(first.title||slug);
fillShared();
fillFields();
showEditor();
})
.catch(function(e){msg(e.message,false)});
}

function save(){
saveFieldsToDraft();
readShared();
var slug=state.shared.slug;
if(!slug){msg("خاص slug",false);return}
var ops=[];
LANGS.forEach(function(L){
var d=state.drafts[L];
if(!d.title.trim())return;
var row={
slug:slug,
lang:L,
title:d.title.trim(),
excerpt:d.excerpt.trim(),
body:d.body,
seo_title:d.seo_title.trim(),
seo_description:d.seo_description.trim(),
category:state.shared.category,
city:state.shared.city||null,
image_url:state.shared.image_url,
sources:state.shared.sources,
published:state.shared.published,
featured:!!state.shared.featured
};
if(state.ids[L]){
ops.push(api("articles?id=eq."+state.ids[L],{method:"PATCH",body:row,prefer:"return=minimal"}));
}else{
ops.push(api("articles",{method:"POST",body:row,prefer:"return=minimal"}));
}
});
if(!ops.length){msg("اكتب عنوان على الأقل فوحدة من اللغات",false);return}
clearMsg();
Promise.all(ops)
.then(function(){return openEditor(slug)})
.then(function(){msg("تم الحفظ",true)})
.catch(function(e){msg(e.message,false)});
}

function closeEditor(){loadList()}

var csel=$("f_city");
var cempty=document.createElement("option");
cempty.value="";
cempty.textContent="بدون مدينة";
csel.appendChild(cempty);
CITIES_LIST.forEach(function(c){
  var o=document.createElement("option");
  o.value=c;o.textContent=c;
  csel.appendChild(o);
});

var sel=$("f_category");
CATS.forEach(function(c){
var o=document.createElement("option");
o.value=c[0];o.textContent=c[1];
sel.appendChild(o);
});

document.querySelectorAll(".langs button").forEach(function(b){
b.addEventListener("click",function(){setLang(b.getAttribute("data-l"))});
});
$("loginBtn").onclick=doLogin;
$("pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("logout").onclick=logout;
$("newBtn").onclick=newArticle;
$("saveBtn").onclick=save;
$("cancelBtn").onclick=closeEditor;

var s=session();
if(s&&s.access_token){showApp();loadList()}else{showLogin()}
})();
</script>
</body>
</html>
